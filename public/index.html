<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://* wss://*; img-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:;">
  <title>倩倩的私人影院</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      color: #e6e9ef;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background:
        radial-gradient(ellipse 80% 60% at 15% 10%, rgba(59, 130, 246, 0.18), transparent 55%),
        radial-gradient(ellipse 70% 55% at 85% 90%, rgba(139, 92, 246, 0.16), transparent 55%),
        linear-gradient(135deg, #0a0e1a 0%, #101828 45%, #0a0e14 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 30px 16px;
    }

    /* 品牌区 */
    .brand { text-align: center; }
    .brand-main {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(120deg, #f0f4ff 0%, #93c5fd 55%, #c4b5fd 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-sub {
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 5px;
      color: #5b6472;
      font-weight: 600;
    }

    /* 视频卡片 */
    .player {
      width: min(840px, 94vw);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 24px 70px rgba(0,0,0,0.65),
        0 0 60px rgba(59, 130, 246, 0.10);
    }

    .player video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    /* 等待层 */
    #waiting {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #5b6472;
      pointer-events: none;
    }
    #waiting .logo {
      font-size: 15px;
      letter-spacing: 4px;
      color: #8b93a1;
    }
    #waiting p { font-size: 13px; }

    /* 错误条 */
    #error {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      padding: 8px 16px;
      background: rgba(200, 0, 0, 0.85);
      border-radius: 999px;
      font-size: 12px;
      display: none;
      max-width: 90%;
      text-align: center;
      white-space: nowrap;
    }

    /* 底部控制行 */
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status {
      font-size: 12px;
      letter-spacing: 1px;
      color: #8a8f98;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-right: 8px;
    }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a3f4a; transition: all .3s; }
    .status.live .dot { background: #4ade80; box-shadow: 0 0 10px #4ade80; }
    .status.live { color: #4ade80; }

    .controls button {
      border: none;
      border-radius: 999px;
      padding: 10px 22px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      color: #fff;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all .2s;
      white-space: nowrap;
    }
    .controls button:active { background: rgba(255,255,255,0.18); }
    .controls button.primary {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border: none;
    }
    .controls button.primary:active { filter: brightness(1.15); }
    .controls button.hidden { display: none; }

    /* 开始观看覆盖层（iOS Safari 必须用户手势才能播放带声音视频） */
    #startOverlay {
      position: absolute;
      inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 10;
      cursor: pointer;
    }
    .start-btn {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5eead4, #2563eb);
      box-shadow: 0 8px 28px rgba(94, 234, 212, 0.4), 0 0 0 6px rgba(255, 255, 255, 0.06);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #0a0e14;
      transition: transform .15s;
    }
    .start-btn:active { transform: scale(0.94); }
    .play-icon { font-size: 38px; line-height: 1; margin-left: 4px; }
    .start-text {
      position: absolute;
      bottom: -32px;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .start-hint {
      color: #9aa;
      font-size: 11px;
      letter-spacing: 1px;
    }

    /* 直播质量浮层（视频画面右上角，半透明黑底） */
    #qualityOverlay {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #4ade80;
      font-size: 11px;
      font-family: Consolas, "Courier New", monospace;
      padding: 5px 9px;
      border-radius: 6px;
      z-index: 5;
      pointer-events: none;
      letter-spacing: 0.5px;
    }
    #qualityOverlay.warn { color: #f5c14a; }
    #qualityOverlay.bad { color: #f87171; }
  </style>
</head>
<body>

  <div class="brand">
    <div class="brand-main">倩倩的私人影院</div>
    <div class="brand-sub">BERLIN CINEMA</div>
  </div>

  <div class="player">
    <video id="video" autoplay playsinline muted></video>

    <!-- 直播质量浮层（观众端：显示自己到服务器的延迟） -->
    <div id="qualityOverlay" style="display:none">延迟 ···</div>

    <div id="waiting">
      <div class="logo">倩倩的私人影院</div>
      <p>等待直播</p>
    </div>

    <!-- 开始观看按钮（iOS Safari 必须在用户手势后才能播放带声音视频） -->
    <div id="startOverlay" style="display:none">
      <div class="start-btn" id="startBtn">
        <div class="play-icon">▶</div>
        <div class="start-text">点击开始观看</div>
      </div>
      <div class="start-hint">iOS 需要点一下才能播放声音</div>
    </div>

    <div id="error"></div>
  </div>

  <div class="controls">
    <span class="status" id="status">
      <span class="dot"></span>
      <span id="statusText">OFFLINE</span>
    </span>
    <button id="fullscreen">⤢ 全屏</button>
  </div>

  <!-- 调试条：始终显示当前上报状态（底部黑底，醒目，排查 iOS fetch 问题） -->
  <div id="debugInfo" style="position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.88);color:#5eead4;font-size:11px;line-height:1.5;padding:6px 12px;z-index:99;word-break:break-all;font-family:Consolas,monospace;border-top:1px solid #2a3140;text-align:center;">等待连接…</div>

  <script src="/vendor/livekit-client.umd.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
